<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAAOrch</title>
<link rel="stylesheet" href="style.css?_v=20260620">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>MAAOrch</h2>
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="daily">日常</button>
        <button class="mode-btn" data-mode="roguelike">肉鸽</button>
        <button class="mode-btn" data-mode="reclamation">生息</button>
      </div>
    </div>
    <nav id="nav">
      <div class="nav-group nav-primary">
        <a class="nav-item" data-page="dashboard">🎛 调度台</a>
        <a class="nav-item" data-page="accounts">👤 账号</a>
        <a class="nav-item" data-page="logs">📋 动态</a>
        <a class="nav-item" data-page="settings">⚙ 设置</a>
        <a class="mobile-more-btn" onclick="toggleMobileMenu()" style="cursor:pointer;font-size:9px;padding:4px 6px;white-space:nowrap;display:none;flex-direction:column;align-items:center;justify-content:center;min-width:48px;border-top:2px solid transparent;flex:1;min-height:44px;color:var(--text2);text-decoration:none">📌 更多</a>
      </div>
      <details class="nav-group nav-secondary" id="nav-more">
        <summary style="font-size:11px;color:var(--text3);padding:6px 14px;cursor:pointer;user-select:none">▸ 更多</summary>
        <a class="nav-item" data-page="queue">📦 队列</a>
        <a class="nav-item" data-page="stats">📊 统计</a>
        <a class="nav-item" data-page="chronicle">📜 编年史</a>
        <a class="nav-item" data-page="gallery">🖼 图库</a>
        <a class="nav-item" data-page="nodes">🌐 远程节点</a>
        <a class="nav-item" data-page="health">🔍 环境检测</a>
        <a class="nav-item" data-page="emus">📱 模拟器</a>
        <a class="nav-item" data-page="about">ℹ️ 关于</a>
      </details>
    </nav>
    <div class="sidebar-footer">
      <div id="vm-status"></div>
      <div id="queue-summary">运行: 0 | 队列: 0</div>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div id="page-title">账号</div>
      <div id="topbar-actions">
        <button onclick="toggleOplog()" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px" title="操作记录">📋</button>
      </div>
    </header>
    <div id="content"></div>
  </main>
</div>
<div id="mobile-menu-overlay" class="mobile-menu-overlay" onclick="closeMobileMenu(event)">
  <div class="mobile-menu-panel" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)">
      <span style="font-size:14px;font-weight:bold;color:var(--text2)">更多</span>
      <span style="flex:1"></span>
      <button onclick="closeMobileMenu()" style="background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer">✕</button>
    </div>
    <div class="mobile-menu-items">
      <a class="nav-item" data-page="queue">📦 队列</a>
      <a class="nav-item" data-page="stats">📊 统计</a>
      <a class="nav-item" data-page="chronicle">📜 编年史</a>
      <a class="nav-item" data-page="gallery">🖼 图库</a>
      <a class="nav-item" data-page="nodes">🌐 远程节点</a>
      <a class="nav-item" data-page="health">🔍 环境检测</a>
      <a class="nav-item" data-page="emus">📱 模拟器</a>
      <a class="nav-item" data-page="about">ℹ️ 关于</a>
    </div>
  </div>
</div>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="app.js?_v=20260620b"></script>
</body>
</html>
