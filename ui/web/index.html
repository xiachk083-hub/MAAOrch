<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAAOrch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?_v=20260816lf2">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>MAAOrch</h2>
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="daily">日常</button>
        <button class="mode-btn" data-mode="roguelike">肉鸽</button>
        <button class="mode-btn" data-mode="reclamation">生息</button>
      </div>
    </div>
    <nav id="nav">
      <div class="nav-group nav-primary">
        <a class="nav-item" data-page="dashboard"><span class="nav-emoji">🎛</span>调度台</a>
        <a class="nav-item" data-page="accounts"><span class="nav-emoji">👤</span>账号</a>
        <a class="nav-item" data-page="queue"><span class="nav-emoji">📦</span>队列</a>
        <a class="nav-item" data-page="connect"><span class="nav-emoji">🔌</span>连接</a>
        <a class="nav-item" data-page="depot"><span class="nav-emoji">🧮</span>材料规划</a>
        <a class="nav-item" data-page="logs"><span class="nav-emoji">📋</span>动态</a>
        <a class="nav-item" data-page="settings"><span class="nav-emoji">⚙</span>设置</a>
        <a class="mobile-more-btn" onclick="toggleMobileMenu()">📌 更多</a>
      </div>
      <details class="nav-group nav-secondary" id="nav-more">
        <summary>更多页</summary>
        <div class="nav-group-label">调度</div>
        <a class="nav-item" data-page="emus">📱 模拟器</a>
        <a class="nav-item" data-page="events">📅 活动</a>
        <div class="nav-group-label">数据</div>
        <a class="nav-item" data-page="stats">📊 统计</a>
        <a class="nav-item" data-page="chronicle">📜 编年史</a>
        <a class="nav-item" data-page="gallery">🖼 图库</a>
        <a class="nav-item" data-page="shots">📸 截图</a>
        <div class="nav-group-label">系统</div>
        <a class="nav-item" data-page="maalog">🧾 MAA 日志</a>
        <a class="nav-item" data-page="audit">🛡 守护审计</a>
        <a class="nav-item" data-page="health">🔍 环境检测</a>
        <a class="nav-item" data-page="nodes">🌐 远程节点</a>
        <a class="nav-item" data-page="about">ℹ️ 关于</a>
      </details>
    </nav>
    <div class="sidebar-footer">
      <div id="vm-status"></div>
      <div id="queue-summary">运行: 0 | 队列: 0</div>
      <div style="margin-top:6px;font-size:9px;letter-spacing:.1em;opacity:.7" id="ui-version">UI v2 · lieflat</div>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div id="page-title">账号</div>
      <div id="topbar-actions">
        <button onclick="cycleTheme()" id="btn-theme" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px" title="切换主题：跟随系统 / 亮色 / 暗色 / Notepaper">🌓</button>
        <button onclick="toggleOplog()" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px" title="操作记录">📋</button>
      </div>
    </header>
    <div id="content"></div>
  </main>
</div>
<div id="mobile-menu-overlay" class="mobile-menu-overlay" onclick="closeMobileMenu(event)">
  <div class="mobile-menu-panel" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)">
      <span style="font-size:14px;font-weight:bold;color:var(--text)">更多</span>
      <span style="flex:1"></span>
      <button onclick="closeMobileMenu()" style="background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer">✕</button>
    </div>
    <div class="mobile-menu-items">
      <div class="nav-group-label">调度</div>
      <a class="nav-item" data-page="emus">📱 模拟器</a>
      <a class="nav-item" data-page="events">📅 活动</a>
      <div class="nav-group-label">数据</div>
      <a class="nav-item" data-page="stats">📊 统计</a>
      <a class="nav-item" data-page="chronicle">📜 编年史</a>
      <a class="nav-item" data-page="gallery">🖼 图库</a>
      <a class="nav-item" data-page="shots">📸 截图</a>
      <div class="nav-group-label">系统</div>
      <a class="nav-item" data-page="maalog">🧾 MAA 日志</a>
      <a class="nav-item" data-page="audit">🛡 守护审计</a>
      <a class="nav-item" data-page="health">🔍 环境检测</a>
      <a class="nav-item" data-page="nodes">🌐 远程节点</a>
      <a class="nav-item" data-page="about">ℹ️ 关于</a>
    </div>
  </div>
</div>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="app.js?_v=20260816lf2"></script>
</body>
</html>
