name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6 pytest
      - run: python -m pytest tests/ -v

  build-release:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6 pyinstaller
        timeout-minutes: 10
      - run: pyinstaller MAAOrch.spec --log-level INFO 2>&1
        timeout-minutes: 15
      - run: dir dist\ 2>&1 || echo "No dist output"
      - name: Upload Release
        shell: pwsh
        run: |
          @"
          import json, urllib.request, os
          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['GITHUB_REF_NAME']
          base = f'https://api.github.com/repos/{repo}'
          auth = {'Authorization': f'Bearer {token}', 'User-Agent': 'MAAOrch', 'Content-Type': 'application/json'}

          body = json.dumps({'tag_name': tag, 'name': tag, 'body': f'MAAOrch {tag} release'}).encode()
          req = urllib.request.Request(f'{base}/releases', data=body, headers=auth)
          release = json.loads(urllib.request.urlopen(req, timeout=10).read())

          url = release['upload_url'].split('{?')[0] + '?name=MAAOrch.exe'
          with open('dist/MAAOrch.exe', 'rb') as f:
              data = f.read()
          req = urllib.request.Request(url, data=data,
              headers={'Authorization': f'Bearer {token}', 'User-Agent': 'MAAOrch', 'Content-Type': 'application/octet-stream'})
          urllib.request.urlopen(req, timeout=60)
          print(f'OK: {release["html_url"]}')
          "@ | Set-Content upload.py -Encoding UTF8
          python upload.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
