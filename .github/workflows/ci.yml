name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6 ruff pytest
      - run: ruff check *.py tests/
      - run: python -m pytest tests/ -v
      - name: Check file size limits
        run: |
          python -c "
          import os; ok=True
           LIMITS={'main_window.py':900,'emu_ops.py':400,'config_ops.py':200,'log_ops.py':450,'maint_ops.py':450,'main.pyw':100,'utils.py':100,'config.py':100,'task_constants.py':250,'updater.py':250,'dialogs.py':450,'pipeline_thread.py':80,'api_server.py':250,'schedule_thread.py':80,'themes.py':100,'background.py':50,'callbacks.py':60,'runner.py':500,'launch_queue.py':300,'stats.py':100}
          for f,limit in LIMITS.items():
              if not os.path.exists(f): continue
              lines=len(open(f,encoding='utf-8').readlines())
              status='OK' if lines<=limit else 'OVER'
              print(f'{f}: {lines}/{limit} {status}')
              if lines>limit: ok=False
          if not ok:
              print('❌ 文件超过行数限制，请拆分')
              exit(1)
               print('✅ 所有文件行数检查通过')
           "

  build-release:
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6 pyinstaller
      - run: pyinstaller MAAOrch.spec
      - uses: softprops/action-gh-release@v1
        with:
          files: dist/MAAOrch.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
