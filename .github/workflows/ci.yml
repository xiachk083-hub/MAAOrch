name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6 ruff pytest
      - run: ruff check *.py tests/
      - run: python -m pytest tests/ -v
      - name: Check file size limits
        run: |
          python -c "
          import os; ok=True
          LIMITS={'main_window.py':900,'emu_ops.py':400,'config_ops.py':200,'log_ops.py':200,'maint_ops.py':300,'main.pyw':100,'utils.py':100,'config.py':100,'task_constants.py':250,'updater.py':200,'dialogs.py':350,'pipeline_thread.py':80,'api_server.py':200,'schedule_thread.py':60,'themes.py':100,'background.py':50}
          for f,limit in LIMITS.items():
              if not os.path.exists(f): continue
              lines=len(open(f,encoding='utf-8').readlines())
              status='OK' if lines<=limit else 'OVER'
              print(f'{f}: {lines}/{limit} {status}')
              if lines>limit: ok=False
          if not ok:
              print('❌ 文件超过行数限制，请拆分')
              exit(1)
          print('✅ 所有文件行数检查通过')
          "
