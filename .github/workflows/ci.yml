name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6 pytest
      - run: python -m pytest tests/ -v

  build-release:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6 pyinstaller
        timeout-minutes: 10
      - run: pyinstaller MAAOrch.spec --log-level INFO 2>&1
        timeout-minutes: 15
      - run: dir dist\ 2>&1 || echo "No dist output"
      - name: Upload Release
        shell: python
        run: |
          import json, urllib.request, os
          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['GITHUB_REF_NAME']
          base = f'https://api.github.com/repos/{repo}'
          auth = {'Authorization': f'Bearer {token}', 'User-Agent': 'MAAOrch', 'Content-Type': 'application/json'}
          # Get or create release
          try:
              req = urllib.request.Request(f'{base}/releases/tags/{tag}', headers=auth)
              with urllib.request.urlopen(req, timeout=10) as r:
                  release = json.loads(r.read().decode())
              print(f'Found existing release: {release["html_url"]}')
          except:
              body = json.dumps({'tag_name': tag, 'name': tag, 'body': f'MAAOrch {tag}'}).encode()
              req = urllib.request.Request(f'{base}/releases', data=body, headers=auth)
              with urllib.request.urlopen(req, timeout=10) as r:
                  release = json.loads(r.read().decode())
              print(f'Created release: {release["html_url"]}')
          # Upload asset
          name = 'MAAOrch.exe'
          upload_url = release['upload_url'].split('{?')[0] + f'?name={name}'
          with open('dist/MAAOrch.exe', 'rb') as f:
              data = f.read()
          req = urllib.request.Request(upload_url, data=data, headers={'Authorization': auth['Authorization'], 'User-Agent': 'MAAOrch', 'Content-Type': 'application/octet-stream'})
          with urllib.request.urlopen(req, timeout=60) as r:
              print(f'Uploaded {name} ({len(data)} bytes)')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
