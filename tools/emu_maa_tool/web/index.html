<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MAAOrch 小工具</title>
<style>
:root {
  --bg: #1a1c22; --bg2: #23262e; --bg3: #2b2f3a; --border: #3a3f4d;
  --text: #d7dce5; --dim: #8b93a3; --accent: #4f9cf7; --ok: #3dd68c; --bad: #e5534b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.5 "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
/* 顶栏 */
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--bg2); border-bottom: 1px solid var(--border); }
.topbar h1 { font-size: 15px; }
.topbar .spacer { flex: 1; }
.conn-status { font-size: 12px; color: var(--dim); }
.conn-status.on { color: var(--ok); }
select, input, button { background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 12px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary { background: #2a4a6e; border-color: #3a6a9e; }
button.danger { color: #f2a0a0; }
/* 主体 */
.main { flex: 1; display: flex; min-height: 0; }
/* 左列表 */
.left { width: 280px; min-width: 180px; display: flex; flex-direction: column; background: var(--bg2); border-right: 1px solid var(--border); }
.left .search { padding: 8px; }
.left .search input { width: 100%; }
.tree { flex: 1; overflow-y: auto; padding: 4px; }
.group { margin-bottom: 2px; }
.group-head { display: flex; align-items: center; gap: 6px; padding: 5px 8px; cursor: pointer; border-radius: 6px; user-select: none; }
.group-head:hover { background: var(--bg3); }
.group-head .arrow { width: 12px; color: var(--dim); transition: transform .15s; }
.group-head.collapsed .arrow { transform: rotate(-90deg); }
.group-head .gname { font-weight: 600; flex: 1; }
.group-head .gcount { color: var(--dim); font-size: 11px; }
.group-head input[type=checkbox] { cursor: pointer; }
.acct-row { display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 26px; border-radius: 6px; cursor: pointer; }
.acct-row:hover { background: var(--bg3); }
.acct-row.selected { background: #2a4a6e; }
.acct-row input[type=checkbox] { cursor: pointer; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; }
.dot.on { background: var(--ok); }
.acct-row .aname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-row .aemu { color: var(--dim); font-size: 11px; }
.left .batch { padding: 8px; border-top: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; }
.left .batch button { flex: 1; white-space: nowrap; }
/* 分隔条 */
.splitter { width: 5px; cursor: col-resize; background: var(--bg2); flex: none; }
.splitter:hover { background: var(--accent); }
/* 右卡片 */
.right { flex: 1; display: flex; align-items: flex-start; justify-content: flex-start; padding: 20px; overflow: auto; }
.card { width: 560px; max-width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; resize: both; overflow: auto; min-width: 320px; min-height: 260px; }
.card h2 { font-size: 16px; margin-bottom: 4px; }
.card .card-sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.row .label { width: 84px; color: var(--dim); }
.row input[type=text] { flex: 1; min-width: 120px; }
.row .btn-group { display: flex; gap: 6px; flex: 1; }
.section { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
.section h3 { font-size: 13px; color: var(--accent); margin-bottom: 10px; }
.status-chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--bg3); color: var(--dim); }
.status-chip.on { color: var(--ok); background: #1d3a2c; }
.status-chip.off { color: var(--dim); }
.hint { color: var(--dim); font-size: 11px; }
/* 日志面板 */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 100; }
.modal-mask.show { display: flex; }
.modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; width: 80vw; max-width: 1000px; height: 78vh; display: flex; flex-direction: column; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.modal-head .spacer { flex: 1; }
.modal-body { flex: 1; display: flex; min-height: 0; }
.run-list { width: 200px; border-right: 1px solid var(--border); overflow-y: auto; padding: 6px; }
.run-list .run { padding: 5px 8px; cursor: pointer; border-radius: 6px; font-size: 12px; }
.run-list .run:hover { background: var(--bg3); }
.run-list .run.active { background: #2a4a6e; }
.log-content { flex: 1; overflow-y: auto; padding: 10px 14px; }
.log-content .file-block { margin-bottom: 14px; }
.log-content .fname { color: var(--accent); font-weight: 600; margin-bottom: 4px; }
.log-content pre { white-space: pre-wrap; word-break: break-all; font: 11px/1.5 Consolas, monospace; color: var(--dim); max-height: 300px; overflow: auto; }
.empty { color: var(--dim); text-align: center; padding: 40px; }
/* 运行中卡片墙 */
.running-hint { color: var(--ok); font-weight: 600; margin-bottom: 10px; }
.card-wall { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.card.mini { width: 340px; max-width: 100%; cursor: pointer; padding: 14px 16px; }
.card.mini:hover { border-color: var(--accent); }
.card.mini.sel { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
.mini-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.mini-name { font-weight: 700; font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-group { font-size: 11px; color: var(--dim); background: var(--bg3); padding: 1px 8px; border-radius: 8px; }
.mini-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.mini-row .label { width: 56px; color: var(--dim); }
.mini-actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.mini-actions button { flex: 1; white-space: nowrap; font-size: 11px; padding: 4px 6px; }
.mini-detail { border-top: 1px solid var(--border); padding-top: 10px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid var(--border); padding: 8px 18px; border-radius: 8px; display: none; z-index: 200; }
</style>
</head>
<body>

<div class="topbar">
  <h1>⚙ MAAOrch 小工具</h1>
  <select id="connAddr" title="连接地址">
    <option value="auto">本机 (127.0.0.1)</option>
    <option value="http://100.79.173.69:18889">远程 (100.79.173.69:18889)</option>
  </select>
  <input id="tokenInput" placeholder="token（远程需要）" style="width:130px"
         value="">
  <span class="conn-status" id="connStatus">● 连接中…</span>
  <span class="spacer"></span>
  <button onclick="window.location.reload()">刷新</button>
</div>

<div class="main">
  <!-- 左列表 -->
  <div class="left" id="leftPanel">
    <div class="search"><input id="searchBox" placeholder="🔍 搜索账号…" oninput="renderTree()"></div>
    <div class="tree" id="tree"></div>
    <div class="batch">
      <button class="primary" onclick="batchAct('start')">开启</button>
      <button class="danger" onclick="batchAct('stop')">关闭</button>
      <button onclick="batchAct('maa_open')">开MAA</button>
      <button onclick="batchAct('maa_close')">关MAA</button>
    </div>
    <div class="batch" style="border-top:0; padding-top:0">
      <button onclick="newGroup()">+ 新建组</button>
      <button onclick="newAccount()">+ 新建账号</button>
    </div>
  </div>
  <div class="splitter" id="splitter"></div>
  <!-- 右卡片 -->
  <div class="right" id="rightPanel">
    <div class="card" id="card">
      <div class="empty">从左侧选择一个账号</div>
    </div>
  </div>
</div>

<!-- 新建账号弹窗 -->
<div class="modal-mask" id="newAccMask">
  <div class="modal" style="width:420px;height:auto">
    <div class="modal-head">
      <b>＋ 新建账号</b>
      <span class="spacer"></span>
      <button onclick="hideNewAcc()">关闭</button>
    </div>
    <div class="modal-body" style="flex-direction:column;padding:16px 20px">
      <div class="row">
        <span class="label">账号名</span>
        <input type="text" id="naName" placeholder="如：官-12 / b-2 / 日-1" style="flex:1">
      </div>
      <div class="row">
        <span class="label">模拟器</span>
        <select id="naEmu" style="flex:1"></select>
      </div>
      <div class="row">
        <span class="label">分组</span>
        <select id="naGroup" style="flex:1"><option value="">未分组</option></select>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="primary" style="flex:1" onclick="doCreateAccount()">创建</button>
      </div>
    </div>
  </div>
</div>

<!-- 日志面板 -->
<div class="modal-mask" id="logMask">
  <div class="modal">
    <div class="modal-head">
      <b>📄 日志</b><span class="hint" id="logAccount"></span>
      <span class="spacer"></span>
      <button onclick="hideLog()">关闭</button>
    </div>
    <div class="modal-body">
      <div class="run-list" id="logRuns"></div>
      <div class="log-content" id="logContent"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
// 优先从 URL 参数取 token（pywebview / 直接开链接时带上），否则读 localStorage
const urlToken = new URLSearchParams(location.search).get('token');
if (urlToken) localStorage.setItem('emu_tool_token', urlToken);
let token = localStorage.getItem('emu_tool_token') || '';
let state = { accounts: [], groups: [] };
let selectedId = null;
let collapsedGroups = new Set(JSON.parse(localStorage.getItem('emu_tool_collapsed') || '[]'));
let expandedRuns = null;
document.getElementById('tokenInput').value = token;
document.getElementById('tokenInput').addEventListener('change', () => {
  token = document.getElementById('tokenInput').value.trim();
  localStorage.setItem('emu_tool_token', token);
  startSSE(); loadAll();
});

function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (token) opts.headers['x-agent-token'] = token;
  if (opts.body && typeof opts.body === 'object') opts.body = JSON.stringify(opts.body);
  return fetch(API + path, opts).then(r => r.json());
}
function toast(msg, ms = 2200) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- 连接地址 ---------- */
function effectiveBase() {
  const v = document.getElementById('connAddr').value;
  if (v === 'auto') return '';
  return v;
}
function fullUrl(path) {
  return effectiveBase() + path;
}
async function apiRemote(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (token) opts.headers['x-agent-token'] = token;
  if (opts.body && typeof opts.body === 'object') opts.body = JSON.stringify(opts.body);
  return fetch(fullUrl(path), opts).then(r => r.json());
}
document.getElementById('connAddr').addEventListener('change', () => {
  startSSE(); loadAll();
});

/* ---------- SSE ---------- */
let es = null;
function startSSE() {
  if (es) { es.close(); es = null; }
  const q = token ? '?token=' + encodeURIComponent(token) : '';
  es = new EventSource(fullUrl('/api/sse') + q);
  es.onopen = () => {
    const el = document.getElementById('connStatus');
    el.textContent = '● 已连接'; el.classList.add('on');
  };
  es.onerror = () => {
    const el = document.getElementById('connStatus');
    el.textContent = '● 断开'; el.classList.remove('on');
  };
  es.onmessage = ev => {
    try {
      const d = JSON.parse(ev.data);
      if (d.type === 'snapshot') {
        // 保留勾选状态（_sel），其余用快照覆盖
        const selSet = {};
        for (const a of state.accounts) if (a._sel) selSet[a.id] = true;
        state.accounts = (d.accounts || []).map(a => {
          if (selSet[a.id]) a._sel = true;
          return a;
        });
        renderTree(); renderCard();
      }
    } catch (e) {}
  };
}

/* 模拟器 index → 名称 映射 */
function emuName(index) {
  if (!index) return '';
  const e = (state.emus || []).find(x => String(x.index) === String(index));
  return e ? e.name : '';
}
function emuOption(index) {
  const nm = emuName(index);
  return nm ? `${nm} (#${index})` : `#${index}`;
}

/* ---------- 数据加载 ---------- */
async function loadAll() {
  const [acc, emus] = await Promise.all([
    apiRemote('/api/accounts').catch(() => ({ ok: false })),
    apiRemote('/api/emulators').catch(() => ({ ok: false })),
  ]);
  if (!acc.ok) { toast('连接失败：无法访问服务端'); return; }
  state.groups = acc.groups || [];
  // 合并账号：/api/accounts 没有运行状态字段，不能整体覆盖——
  // 保留 SSE 快照里的 emu/maa 状态，只更新静态信息（名称/分组/备注/模拟器）。
  const newAccounts = acc.accounts || [];
  const oldById = {};
  for (const a of state.accounts) oldById[a.id] = a;
  state.accounts = newAccounts.map(n => {
    const old = oldById[n.id] || {};
    return Object.assign({}, old, n);
  });
  state.emus = (emus && emus.emulators) || [];
  renderTree(); renderCard();
}

/* ---------- 分组树 ---------- */
function filteredAccounts() {
  const q = (document.getElementById('searchBox').value || '').trim().toLowerCase();
  if (!q) return state.accounts;
  return state.accounts.filter(a =>
    (a.name || '').toLowerCase().includes(q) || (a.id || '').toLowerCase().includes(q));
}
function renderTree() {
  const tree = document.getElementById('tree');
  const list = filteredAccounts();
  const byGroup = {};
  for (const a of list) {
    const g = a.group || '__ungrouped__';
    (byGroup[g] = byGroup[g] || []).push(a);
  }
  const order = [...state.groups.filter(g => byGroup[g]), '__ungrouped__']
    .filter(g => byGroup[g]);
  let html = '';
  for (const g of order) {
    const accounts = byGroup[g];
    const gname = g === '__ungrouped__' ? '未分组' : g;
    const allOn = accounts.every(a => a.maa && a.maa.running || a.emu && a.emu.running);
    html += `<div class="group">
      <div class="group-head ${collapsedGroups.has(g) ? 'collapsed' : ''}"
           onclick="toggleGroup('${esc(g)}', event)">
        <span class="arrow">▼</span>
        <input type="checkbox" onclick="toggleGroupAll('${esc(g)}', event)"
               title="勾选整组" ${accounts.every(a => a._sel) ? 'checked' : ''}>
        <span class="gname">${esc(gname)}</span>
        <span class="gcount">${accounts.length}</span>
      </div>`;
    if (!collapsedGroups.has(g)) {
      for (const a of accounts) {
        const emuOn = a.emu && a.emu.running;
        const maaOn = a.maa && a.maa.running;
        html += `<div class="acct-row ${selectedId === a.id ? 'selected' : ''}"
             onclick="selectAccount('${esc(a.id)}')">
          <input type="checkbox" onclick="toggleSelect('${esc(a.id)}', event)" ${a._sel ? 'checked' : ''}>
          <span class="dot ${emuOn || maaOn ? 'on' : ''}"></span>
          <span class="aname">${esc(a.name || a.id)}</span>
          <span class="aemu" title="${esc(emuName(a.emu_index))}">${esc(emuOption(a.emu_index))}</span>
        </div>`;
      }
    }
    html += '</div>';
  }
  tree.innerHTML = html || '<div class="empty">暂无账号<br><br><button onclick="newAccount()">+ 新建账号</button></div>';
}
function toggleGroup(g, ev) {
  if (ev.target.tagName === 'INPUT') return;
  if (collapsedGroups.has(g)) collapsedGroups.delete(g); else collapsedGroups.add(g);
  localStorage.setItem('emu_tool_collapsed', JSON.stringify([...collapsedGroups]));
  renderTree();
}
function toggleGroupAll(g, ev) {
  ev.stopPropagation();
  const list = filteredAccounts().filter(a => (a.group || '__ungrouped__') === g);
  const all = list.every(a => a._sel);
  for (const a of list) a._sel = !all;
  renderTree();
}
function toggleSelect(id, ev) {
  ev.stopPropagation();
  const a = state.accounts.find(x => x.id === id);
  if (a) a._sel = !a._sel;
  renderTree();
}
function selectedAccounts() {
  return state.accounts.filter(a => a._sel);
}
function selectAccount(id) {
  selectedId = id;
  renderTree(); renderCard();
}

/* ---------- 批量操作 ---------- */
async function batchAct(kind) {
  const sel = selectedAccounts();
  if (!sel.length) { toast('请先勾选账号'); return; }
  if (kind === 'start' || kind === 'stop') {
    const indexes = [...new Set(sel.map(a => a.emu_index).filter(Boolean))];
    if (!indexes.length) { toast('选中的账号未绑定模拟器'); return; }
    await apiRemote('/api/emulators/' + kind, { method: 'POST', body: { indexes } });
    toast(`${kind === 'start' ? '开启' : '关闭'} ${indexes.length} 台模拟器`);
  } else if (kind === 'maa_open') {
    let n = 0;
    for (const a of sel) {
      const r = await apiRemote('/api/maa/open', { method: 'POST', body: { account_id: a.id } }).catch(() => ({}));
      if (r.ok) n++;
    }
    toast(`打开 MAA ${n} 个`);
  } else if (kind === 'maa_close') {
    let n = 0;
    for (const a of sel) {
      await apiRemote('/api/maa/close', { method: 'POST', body: { account_id: a.id } }).catch(() => {});
      n++;
    }
    toast(`关闭 MAA ${n} 个`);
  }
}

/* ---------- 新建组/账号 ---------- */
async function newGroup() {
  const name = prompt('新组名：');
  if (!name) return;
  const r = await apiRemote('/api/groups', { method: 'POST', body: { name } });
  toast(r.ok ? `组 ${name} 已创建` : (r.detail || '创建失败'));
  loadAll();
}
async function newAccount() {
  // 弹窗：按名称下拉选模拟器
  const emuSel = document.getElementById('naEmu');
  emuSel.innerHTML = '<option value="">— 选择模拟器 —</option>' +
    (state.emus || []).map(e =>
      `<option value="${esc(e.index)}">${esc(e.name)} (#${esc(e.index)})</option>`).join('');
  const grpSel = document.getElementById('naGroup');
  grpSel.innerHTML = '<option value="">未分组</option>' +
    (state.groups || []).map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
  document.getElementById('naName').value = '';
  document.getElementById('newAccMask').classList.add('show');
}
function hideNewAcc() {
  document.getElementById('newAccMask').classList.remove('show');
}
async function doCreateAccount() {
  const name = document.getElementById('naName').value.trim();
  const emu_index = document.getElementById('naEmu').value;
  const group = document.getElementById('naGroup').value;
  if (!name) { toast('账号名不能为空'); return; }
  const r = await apiRemote('/api/accounts', { method: 'POST', body: { name, emu_index, group } });
  toast(r.ok ? `账号 ${name} 已创建` : (r.detail || '创建失败'));
  if (r.ok) hideNewAcc();
  loadAll();
}

/* ---------- 卡片（运行中卡片墙） ---------- */
function findSelected() {
  return state.accounts.find(a => a.id === selectedId);
}
function runningAccounts() {
  return state.accounts.filter(a => (a.emu && a.emu.running) || (a.maa && a.maa.running));
}
function renderCard() {
  const card = document.getElementById('card');
  const running = runningAccounts();
  if (!running.length) {
    card.innerHTML = '<div class="empty">当前没有正在运行的账号<br><br>从左侧勾选账号后点「开启」或「打开 MAA」</div>';
    return;
  }
  card.innerHTML = `<div style="width:100%;max-width:900px">
    <div class="running-hint">▶ 正在运行 (${running.length})</div>
    <div class="card-wall">
      ${running.map(a => cardHtml(a)).join('')}
    </div>
  </div>`;
}
function cardHtml(a) {
  const emuOn = a.emu && a.emu.running;
  const maaOn = a.maa && a.maa.running;
  const port = (a.emu && a.emu.adb_port) || '';
  const sel = selectedId === a.id;
  return `
  <div class="card mini ${sel ? 'sel' : ''}" onclick="selectAccount('${esc(a.id)}')">
    <div class="mini-head">
      <span class="mini-name">${esc(a.name)}</span>
      ${a.group ? `<span class="mini-group">${esc(a.group)}</span>` : ''}
    </div>
    <div class="mini-row">
      <span class="label">模拟器</span>
      <span class="status-chip ${emuOn ? 'on' : 'off'}">${emuOn ? '● 运行中' : '○ 已停止'}</span>
      <span class="hint">${esc(emuOption(a.emu_index))} ${port ? '· ' + esc(port) : ''}</span>
    </div>
    <div class="mini-row">
      <span class="label">MAA</span>
      <span class="status-chip ${maaOn ? 'on' : 'off'}">${maaOn ? '● 运行中' : '○ 未启动'}</span>
      ${maaOn && a.maa ? `<span class="hint">副本 ${esc(a.maa.instance || '')}</span>` : ''}
    </div>
    <div class="mini-actions" onclick="event.stopPropagation()">
      <button class="primary" onclick="cardEmu('${esc(a.id)}','start')" ${emuOn ? 'disabled' : ''}>开模拟器</button>
      <button class="danger" onclick="cardEmu('${esc(a.id)}','stop')" ${!emuOn ? 'disabled' : ''}>关模拟器</button>
      <button class="primary" onclick="cardMaa('${esc(a.id)}','open')" ${maaOn ? 'disabled' : ''}>打开MAA</button>
      <button class="danger" onclick="cardMaa('${esc(a.id)}','close')" ${!maaOn ? 'disabled' : ''}>关闭MAA</button>
      <button onclick="cardConfig('${esc(a.id)}')" title="弹出 MAA 配置界面，配置后点「保存配置」">⚙ 配置 MAA</button>
      <button class="primary" onclick="cardSaveConfig('${esc(a.id)}')" title="把当前 MAA 配置保存到账号存档">💾 保存配置</button>
      <button onclick="cardWindow('${esc(a.id)}')" ${!maaOn ? 'disabled' : ''}>📌 小窗</button>
      <button onclick="showLog('${esc(a.id)}')">📄 日志</button>
    </div>
    <div class="mini-detail" onclick="event.stopPropagation()">
      <div class="row" style="margin-bottom:6px">
        <span class="label">模拟器</span>
        <select onchange="changeEmu('${esc(a.id)}', this.value)">
          <option value="">— 选择模拟器 —</option>
          ${(state.emus || []).map(e =>
            `<option value="${esc(e.index)}" ${String(a.emu_index) === String(e.index) ? 'selected' : ''}>${esc(e.name)} (#${esc(e.index)})</option>`).join('')}
        </select>
      </div>
      <div class="row" style="margin-bottom:6px">
        <span class="label">分组</span>
        <select onchange="changeGroup('${esc(a.id)}', this.value)">
          <option value="">未分组</option>
          ${state.groups.map(g => `<option value="${esc(g)}" ${a.group === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}
        </select>
      </div>
      <div class="row" style="margin-bottom:0">
        <span class="label">备注</span>
        <input type="text" class="note-inp" data-id="${esc(a.id)}" value="${esc(a.note || '')}" placeholder="给账号打备注…">
        <button onclick="saveNoteFrom('${esc(a.id)}', this)">保存</button>
      </div>
    </div>
  </div>`;
}
async function cardEmu(id, kind) {
  const a = state.accounts.find(x => x.id === id); if (!a) return;
  await apiRemote('/api/emulators/' + kind, { method: 'POST', body: { indexes: [a.emu_index] } });
  toast(`${kind === 'start' ? '开启' : '关闭'} 模拟器 #${a.emu_index}`);
}
async function cardMaa(id, kind) {
  const r = await apiRemote('/api/maa/' + kind, { method: 'POST', body: { account_id: id } }).catch(() => ({}));
  if (r && r.ok) toast(kind === 'open' ? `MAA 已打开（${r.port || ''}）` : 'MAA 已关闭');
  else toast((r && (r.detail || r.error)) || '操作失败');
}
async function cardConfig(id) {
  // 配置模式：弹出 MAA 让用户配置（不最小化）
  const r = await apiRemote('/api/maa/open', { method: 'POST', body: { account_id: id, mode: 'config' } }).catch(() => ({}));
  if (r && r.ok) toast('MAA 已弹出，请配置后点「保存配置」');
  else toast((r && (r.detail || r.error)) || '打开配置失败（模拟器是否已启动？）');
}
async function cardSaveConfig(id) {
  // 保存配置：读取当前 MAA 副本配置存回账号存档，然后关闭 MAA
  const r = await apiRemote('/api/maa/save_config', { method: 'POST', body: { account_id: id } }).catch(() => ({}));
  if (r && r.ok) toast('配置已保存到账号存档，MAA 已关闭');
  else toast((r && (r.detail || r.error)) || '保存配置失败');
}
async function cardWindow(id) {
  const r = await apiRemote('/api/maa/window', { method: 'POST', body: { account_id: id, action: 'toggle' } }).catch(() => ({}));
  toast(r && r.ok ? (r.minimized ? '已最小化' : '已还原') : '窗口操作失败');
}
async function saveNoteFrom(id, btn) {
  const inp = btn.previousElementSibling;
  await apiRemote('/api/accounts/' + id + '/note', { method: 'POST', body: { note: inp.value } });
  toast('备注已保存');
  loadAll();
}
async function changeGroup(id, group) {
  await apiRemote('/api/accounts/' + id + '/group', { method: 'POST', body: { group } });
  toast('已移动分组');
  loadAll();
}
async function changeEmu(id, emu_index) {
  await apiRemote('/api/accounts/' + id + '/bind_emu', { method: 'POST', body: { emu_index } });
  toast('已换绑模拟器');
  loadAll();
}

/* ---------- 日志 ---------- */
async function showLog(accId) {
  const a = accId ? state.accounts.find(x => x.id === accId) : findSelected();
  if (!a) return;
  document.getElementById('logAccount').textContent = a.name + ' 的日志';
  document.getElementById('logMask').classList.add('show');
  const r = await apiRemote('/api/accounts/' + a.id + '/logs').catch(() => ({ ok: false }));
  const runs = (r && r.runs) || [];
  const list = document.getElementById('logRuns');
  list.innerHTML = runs.length
    ? runs.map((x, i) => `<div class="run ${i === runs.length - 1 ? 'active' : ''}" onclick="loadRun('${x.time}', this)">${esc(x.time)}</div>`).join('')
    : '<div class="empty">暂无归档日志</div>';
  if (runs.length) loadRun(runs[runs.length - 1].time);
  else document.getElementById('logContent').innerHTML = '<div class="empty">暂无日志</div>';
}
function hideLog() {
  document.getElementById('logMask').classList.remove('show');
}
async function loadRun(run, el) {
  const a = findSelected(); if (!a) return;
  if (el) { document.querySelectorAll('.run-list .run').forEach(x => x.classList.remove('active')); el.classList.add('active'); }
  const r = await apiRemote(`/api/accounts/${a.id}/logs/${run}`).catch(() => ({ ok: false }));
  const files = (r && r.files) || [];
  document.getElementById('logContent').innerHTML = files.length
    ? files.map(f => `<div class="file-block"><div class="fname">${esc(f.file)}</div><pre>${esc(f.content)}</pre></div>`).join('')
    : '<div class="empty">无内容</div>';
}

/* ---------- 卡片/列表可调大小 ---------- */
(function initSplitter() {
  const sp = document.getElementById('splitter');
  const left = document.getElementById('leftPanel');
  const saved = localStorage.getItem('emu_tool_left_w');
  if (saved) left.style.width = saved + 'px';
  sp.addEventListener('mousedown', e => {
    e.preventDefault();
    const onMove = ev => {
      const w = Math.min(Math.max(ev.clientX, 180), window.innerWidth - 320);
      left.style.width = w + 'px';
      localStorage.setItem('emu_tool_left_w', String(w));
    };
    const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
})();

/* ---------- 初始化 ---------- */
document.getElementById('logMask').addEventListener('click', e => {
  if (e.target === e.currentTarget) hideLog();
});
startSSE();
loadAll();
</script>
