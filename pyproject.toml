[project]
name = "MAAOrch"
version = "1.0.0"
description = "MAA 多账号批量管理工具"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.0"]

[project.scripts]
maaorch = "main:main"

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "UP"]
ignore = ["E501", "F841", "N802", "N803", "N806", "SIM108", "SIM114"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
